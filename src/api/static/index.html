<!DOCTYPE html>
<!-- =========================================================
     المرحلة 4 — واجهة المستخدم
     =========================================================
     صفحة واحدة فيها حقل إدخال وزر فحص. النتيجة تظهر بلا إعادة
     تحميل الصفحة، عبر Fetch API الذي يتحدث مع مسار /predict.

     قاعدتان أمنيتان في هذه الصفحة:
       1. الرابط المفحوص يُعرض كنص خام عبر textContent، ولا يُدرج
          أبداً بـ innerHTML. لو أدرجناه كـ HTML لأمكن لرابط خبيث
          أن يحقن كوداً يعمل داخل صفحتنا (ثغرة XSS).
       2. الرابط لا يُحوَّل إلى وسم <a> قابل للنقر. الصفحة أداة فحص
          لا بوابة زيارة، وجعله قابلاً للنقر يجعلنا نساعد المستخدم
          على الوقوع في الفخ الذي جاء يتجنبه.
     ========================================================= -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام كشف روابط التصيد الاحتيالي</title>

  <!-- Tailwind عبر CDN: إطار تنسيق يعطي أصنافاً جاهزة بدل كتابة CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* خط عربي واضح للقراءة */
    body { font-family: "Segoe UI", Tahoma, sans-serif; }
    /* الرابط المعروض قد يكون طويلاً جداً، فنجبره على النزول لسطر جديد */
    .break-url { word-break: break-all; }
  </style>
</head>

<body class="bg-slate-100 min-h-screen py-10 px-4">

  <div class="max-w-2xl mx-auto">

    <!-- ===== العنوان ===== -->
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold text-slate-800">🛡️ كاشف روابط التصيد الاحتيالي</h1>
      <p class="text-slate-600 mt-2">
        فحص فوري للرابط بتحليل نصّه فقط — لا يُفتح الموقع ولا يُنزَّل محتواه
      </p>
    </header>

    <!-- ===== بطاقة الإدخال ===== -->
    <div class="bg-white rounded-xl shadow p-6">
      <label for="urlInput" class="block text-slate-700 font-semibold mb-2">
        الصق الرابط المراد فحصه
      </label>

      <div class="flex gap-2">
        <!-- حقل النص: نوعه text لا url حتى يقبل الروابط بدون بروتوكول -->
        <input id="urlInput" type="text" maxlength="2000" dir="ltr"
               placeholder="example.com/login"
               class="flex-1 border border-slate-300 rounded-lg px-4 py-2
                      focus:outline-none focus:ring-2 focus:ring-blue-500">

        <!-- زر الفحص -->
        <button id="checkBtn"
                class="bg-blue-600 hover:bg-blue-700 text-white font-semibold
                       px-6 py-2 rounded-lg transition disabled:opacity-50">
          فحص
        </button>
      </div>

      <p class="text-xs text-slate-500 mt-2">
        اضغط Enter أيضاً للفحص. لن يُفتح الرابط في أي حال.
      </p>
    </div>

    <!-- ===== منطقة النتيجة (مخفية حتى يصل رد) ===== -->
    <div id="result" class="hidden mt-6 rounded-xl shadow-2xl overflow-hidden">
      <!-- النتيجة فقط: أخضر (آمن) أو أحمر (خطر) -->
      <div id="banner" class="p-12 text-white text-center">
        <div class="text-6xl mb-4" id="icon"></div>
        <div class="text-4xl font-bold" id="verdict"></div>
      </div>
    </div>

    <!-- ===== منطقة الخطأ ===== -->
    <div id="error" class="hidden mt-6 bg-amber-50 border border-amber-300
                           text-amber-800 rounded-xl p-4"></div>

    <footer class="text-center text-xs text-slate-400 mt-10">
      مشروع تخرج — نظام كشف روابط التصيد الاحتيالي بتعلم الآلة
    </footer>
  </div>


<script>
// اختصارات للوصول إلى عناصر الصفحة
const $ = (id) => document.getElementById(id);
const input = $("urlInput"), btn = $("checkBtn");
const resultBox = $("result"), errorBox = $("error");


// =========================================================
// الدالة الرئيسية: إرسال الرابط للخادم وعرض النتيجة
// =========================================================
async function checkUrl() {
  const url = input.value.trim();          // قراءة ما كتبه المستخدم وتنظيف المسافات

  resultBox.classList.add("hidden");       // إخفاء أي نتيجة سابقة
  errorBox.classList.add("hidden");        // إخفاء أي خطأ سابق

  if (!url) {                              // الحقل فارغ
    showError("الرجاء إدخال رابط أولاً.");
    return;
  }

  btn.disabled = true;                     // تعطيل الزر لمنع الضغط المتكرر
  btn.textContent = "جاري الفحص...";       // إشعار المستخدم أن العملية جارية

  try {
    // إرسال الطلب إلى الخادم. الصفحة والـAPI على نفس المصدر فلا حاجة لأي إعداد إضافي.
    const res = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: url }),  // تحويل الرابط إلى JSON
    });

    const data = await res.json();         // قراءة الرد وتحويله من JSON

    if (!res.ok) {                         // الخادم رفض الطلب (رابط غير صالح مثلاً)
      showError(data.detail || "تعذّر فحص هذا الرابط.");
      return;
    }

    showResult(data, url);                 // كل شيء تمام: نعرض النتيجة

  } catch (e) {                            // الخادم متوقف أو انقطع الاتصال
    showError("تعذّر الاتصال بالخادم. تأكد أن الخادم يعمل عبر: python main.py");
  } finally {
    btn.disabled = false;                  // إعادة تفعيل الزر في كل الأحوال
    btn.textContent = "فحص";               // إعادة نص الزر الأصلي
  }
}


// =========================================================
// عرض النتيجة على الشاشة - بسيطة: أحمر (خطر) أو أخضر (آمن)
// =========================================================
function showResult(data, originalUrl) {
  const isPhishing = data.label === 1;                    // هل الحكم تصيد؟

  // ---- النتيجة البسيطة: لون واحد فقط ----
  if (isPhishing) {
    // أحمر = خطر
    $("banner").className = "p-12 text-white text-center bg-red-600";
    $("icon").textContent = "⛔";
    $("verdict").textContent = "رابط خطر";
  } else {
    // أخضر = آمن
    $("banner").className = "p-12 text-white text-center bg-green-600";
    $("icon").textContent = "✅";
    $("verdict").textContent = "رابط آمن";
  }

  resultBox.classList.remove("hidden");                   // إظهار بطاقة النتيجة
}


// =========================================================
// عرض رسالة خطأ
// =========================================================
function showError(msg) {
  errorBox.textContent = msg;                             // نص فقط، لا HTML
  errorBox.classList.remove("hidden");                    // إظهار صندوق الخطأ
}


// =========================================================
// ربط الأحداث
// =========================================================
btn.addEventListener("click", checkUrl);                  // الضغط على زر الفحص
input.addEventListener("keydown", (e) => {                // الضغط على Enter داخل الحقل
  if (e.key === "Enter") checkUrl();
});
</script>

</body>
</html>
